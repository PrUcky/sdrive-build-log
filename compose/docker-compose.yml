# ==============================================================================
# sdrive — Ente Self-Hosted Stack (Hardened Garage Edition)
# ==============================================================================
# CHANGELOG:
#   Day 21: Stock quickstart with MinIO (baseline proved)
#   Day 22: MinIO → Garage swap
#   Day 23: Container hardening (resource limits, security opts, read-only
#           rootfs, restart policies, tmpfs for transient writes)
#
# Reference: weeks/week-03/day-23.md, docs/container-hardening-checklist.md
# ==============================================================================

version: "3.8"

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 — Metadata & Control Plane
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-bookworm@sha256:3d9ed832906091d609cfd6f283e79492ace01ba15b6c65850d39c5f07cb5a6e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ente_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # --- HARDENING (Day 23) ---
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32M
      - /run:size=16M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d ente_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Garage — Rust S3-Compatible Object Storage
  # --------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/mnt/data/garage/meta
      - garage-data:/mnt/data/garage/data
    # --- HARDENING (Day 23) ---
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 32M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3903/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Ente Museum — Go API Backend
  # --------------------------------------------------------------------------
  museum:
    image: ghcr.io/ente-io/server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./museum.yaml:/museum.yaml:ro
      - museum-data:/data
    environment:
      ENTE_CREDENTIALS_FILE: /museum.yaml
    # --- HARDENING (Day 23) ---
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

volumes:
  postgres-data:
    driver: local
  garage-meta:
    driver: local
  garage-data:
    driver: local
  museum-data:
    driver: local

networks:
  internal:
    driver: bridge
