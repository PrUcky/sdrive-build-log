# ==============================================================================
# sdrive — Ente Self-Hosted Stack (Garage Edition)
# ==============================================================================
# CHANGELOG from stock quickstart baseline:
#   - REPLACED MinIO with Garage (Rust S3 daemon, ~30 MB vs ~90 MB RAM)
#   - Garage data/meta dirs mounted directly to SSD at /mnt/data/garage
#   - Museum S3 endpoint updated to point at garage:3900
#   - All other services unchanged from Day 21 baseline
#
# Week 03 Day 21: Stock quickstart with MinIO (baseline proved)
# Week 03 Day 22: MinIO → Garage swap (this file)
#
# Reference: weeks/week-03/day-22.md
# ==============================================================================

version: "3.8"

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 — Metadata & Control Plane
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-bookworm@sha256:3d9ed832906091d609cfd6f283e79492ace01ba15b6c65850d39c5f07cb5a6e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ente_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d ente_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Garage — Rust S3-Compatible Object Storage
  # --------------------------------------------------------------------------
  # Replaces MinIO from the stock quickstart.
  #
  # WHY GARAGE:
  #   - Written in Rust: 30 MB RSS vs MinIO's 90 MB (critical on 4 GB board)
  #   - Single static binary, no runtime dependencies
  #   - Designed for edge/self-hosted from the ground up
  #   - S3-compatible: museum can't tell the difference
  #
  # FIRST-TIME SETUP:
  #   After `docker compose up -d`, run:
  #     ./scripts/garage-init-layout.sh
  #   This assigns the node role, creates the bucket, and generates API keys.
  # --------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/mnt/data/garage/meta
      - garage-data:/mnt/data/garage/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3903/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Ente Museum — Go API Backend
  # --------------------------------------------------------------------------
  museum:
    image: ghcr.io/ente-io/server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./museum.yaml:ro
      - museum-data:/data
    environment:
      ENTE_CREDENTIALS_FILE: /museum.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

volumes:
  postgres-data:
    driver: local
  garage-meta:
    driver: local
  garage-data:
    driver: local
  museum-data:
    driver: local

networks:
  internal:
    driver: bridge
