# ==============================================================================
# museum.yaml — Ente Museum Backend Configuration (Hardened Garage Edition)
# ==============================================================================
# CHANGELOG:
#   Day 21: Stock baseline with MinIO
#   Day 22: S3 endpoint switched to Garage
#   Day 23: Added internal.admins template, hardening notes
#
# SECURITY: All values below are PLACEHOLDERS. Real secrets are generated
# on the board with `openssl rand -hex 32` and never committed to git.
#
# Reference: weeks/week-03/day-23.md, docs/first-account-setup.md
# ==============================================================================

db:
  host: postgres
  port: 5432
  name: ente_db
  user: pguser
  password: REPLACE_WITH_STRONG_PASSWORD
  sslmode: disable

s3:
  are_local_buckets: true
  endpoint: http://garage:3900
  region: us-east-1
  access_key: REPLACE_WITH_GARAGE_ACCESS_KEY
  secret_key: REPLACE_WITH_GARAGE_SECRET_KEY
  bucket: b2-eu-cen

jwt:
  secret: REPLACE_WITH_64_CHAR_HEX_SECRET

key:
  encryption: REPLACE_WITH_64_CHAR_HEX_KEY
  hash: REPLACE_WITH_64_CHAR_HEX_KEY

# --------------------------------------------------------------------------
# Internal admin configuration
# --------------------------------------------------------------------------
# Step 1: Register your first account via the Ente app
# Step 2: Read the verification OTP from: docker logs sdrive-stack-museum-1
# Step 3: Find your numeric user ID:
#         docker exec sdrive-stack-postgres-1 \
#           psql -U pguser -d ente_db -t -c "SELECT user_id, email FROM users;"
# Step 4: Uncomment and add your user ID below, then restart museum:
#         docker compose restart museum
# Step 5: Remove trial quota:
#         ente admin update-subscription --no-limit
#
# See docs/first-account-setup.md for the complete walkthrough.
# --------------------------------------------------------------------------
# internal:
#   admins:
#     - YOUR_NUMERIC_USER_ID
#   disable-registration: false

smtp:
  # Self-hosted: verification codes appear in container logs (no SMTP needed)
  # To enable email delivery, configure a real SMTP relay here.
  host: ""
  port: 587
  username: ""
  password: ""

log:
  level: info
