# ==============================================================================
# museum.yaml — Ente Museum Backend Configuration (Garage Edition)
# ==============================================================================
# Updated from stock baseline to point at Garage instead of MinIO.
#
# CHANGES from Day 21 baseline:
#   - s3.endpoint: http://minio:9000 → http://garage:3900
#   - s3.access_key / secret_key: now generated by garage-init-layout.sh
#
# Reference: weeks/week-03/day-22.md
# ==============================================================================

db:
  host: postgres
  port: 5432
  name: ente_db
  user: pguser
  password: REPLACE_WITH_STRONG_PASSWORD
  sslmode: disable

s3:
  are_local_buckets: true
  # --- CHANGED: MinIO → Garage ---
  endpoint: http://garage:3900
  region: us-east-1
  access_key: REPLACE_WITH_GARAGE_ACCESS_KEY
  secret_key: REPLACE_WITH_GARAGE_SECRET_KEY
  bucket: b2-eu-cen

jwt:
  secret: REPLACE_WITH_64_CHAR_HEX_SECRET

key:
  encryption: REPLACE_WITH_64_CHAR_HEX_KEY
  hash: REPLACE_WITH_64_CHAR_HEX_KEY

# --------------------------------------------------------------------------
# Internal admin configuration
# --------------------------------------------------------------------------
# After creating your first account, find your numeric user ID in the
# museum logs, then add it here and restart the container:
#
# internal:
#   admins:
#     - YOUR_NUMERIC_USER_ID
#
# Then run:  ente admin update-subscription --no-limit
# This removes the trial storage quota that blocks large imports.
# --------------------------------------------------------------------------

smtp:
  host: ""
  port: 587
  username: ""
  password: ""

log:
  level: info
