# ==============================================================================
# OpenSSH Server Hardening Configuration — sdrive Appliance
# Target Path: /etc/ssh/sshd_config.d/01-sdrive-hardening.conf
# ==============================================================================

# Authentication & Access Control
PasswordAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
AuthenticationMethods publickey
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

# Session & Security Limits
MaxAuthTries 3
LoginGraceTime 30s
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable Unnecessary Features & Protocols
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
GatewayPorts no
PermitUserEnvironment no

# Modern Cryptographic Primitives (Restricting legacy ciphers & key exchanges)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-00@openssh.com
