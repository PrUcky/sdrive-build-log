# ==============================================================================
# Linux Virtual Memory & Storage Tuning — sdrive Embedded Appliance
# Target Path: /etc/sysctl.d/99-sdrive-zram-storage.conf
# ==============================================================================

# Memory Reclaim & Inode Caching
# Lower value (50) tells kernel to prefer keeping directory and inode caches in RAM,
# drastically reducing repetitive random metadata reads from slow flash storage.
vm.vfs_cache_pressure = 50

# Swappiness & ZRAM Behavior
# Set to 10 to avoid swapping out active daemons (museum, garage) while allowing zram
# to absorb transient memory spikes under burst photo upload loads.
vm.swappiness = 10

# ZRAM Page Cluster (0 = 1 page at a time)
# For compressed in-memory zram swap, reading multi-page clusters adds CPU overhead.
# Setting page-cluster to 0 reads exactly 1 page (4KB) at a time, minimizing latency.
vm.page-cluster = 0

# Dirty Page Background Writeback Ratios
# Start background flush when dirty memory exceeds 5% of total RAM (~200MB on 4GB).
# Force synchronous writeback if dirty memory exceeds 10% of total RAM (~400MB).
# This prevents sudden massive multi-gigabyte disk write stalls on flash media.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Writeback Interval Tuning (Centiseconds)
# Flushes dirty pages to disk every 15 seconds (1500 centiseconds) instead of 5s default,
# consolidating random writes and reducing flash write amplification.
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000
