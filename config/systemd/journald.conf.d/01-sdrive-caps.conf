# ==============================================================================
# systemd-journald Log Size Cap — sdrive Flash Protection
# Target Path: /etc/systemd/journald.conf.d/01-sdrive-caps.conf
# ==============================================================================

[Journal]
# Storage mode: persistent on disk (buffered via zram in Armbian)
Storage=persistent

# Hard caps on total journal disk space (protects microSD card from filling)
SystemMaxUse=100M
SystemKeepFree=1G
SystemMaxFileSize=10M

# Runtime (in-memory) journal caps
RuntimeMaxUse=50M
RuntimeKeepFree=500M
RuntimeMaxFileSize=5M

# Rate limiting to prevent rogue daemons from spamming disk I/O
RateLimitIntervalSec=30s
RateLimitBurst=1000

# Compression algorithm (zstd provides optimal compression ratio vs CPU)
Compress=yes
