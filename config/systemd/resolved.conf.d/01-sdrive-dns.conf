# sdrive — systemd-resolved DNS Hardening
#
# Drop-in: /etc/systemd/resolved.conf.d/01-sdrive-dns.conf
#
# Design rationale:
#   - Primary resolver:  Cloudflare 1.1.1.1 (lowest latency from ISP edge, ~8ms)
#   - Secondary:         Google 8.8.8.8 (independent infrastructure, ~12ms)
#   - Tertiary:          Local router 192.168.1.1 (fallback for LAN-only scenarios)
#   - DNSSEC:            allow-downgrade (fail-open if upstream strips signatures)
#   - DNS-over-TLS:      opportunistic (encrypt when supported, don't break if not)
#
# Installed by: scripts/bootstrap-node.sh
# Referenced in: weeks/week-02/day-15.md

[Resolve]
DNS=1.1.1.1 8.8.8.8 192.168.1.1
FallbackDNS=1.0.0.1 8.8.4.4
DNSSEC=allow-downgrade
DNSOverTLS=opportunistic
Cache=yes
CacheFromLocalhost=no
